# Nordschleife nacht terminal. Night at 90% with compositor blur behind it;
# parchment text, the cursor in the attention colour.
# Both colour sections carry the same palette so a light/dark switch keybind
# cannot pull in foot's stock colours.

[main]
font=Overpass Mono:size=10.5
line-height=20
pad=16x16
initial-color-theme=dark

[bell]
# A bell in a window without the focus marks it urgent, which the bar's workspace slot shows.
urgent=yes

[cursor]
style=beam
blink=no
beam-thickness=2

[colors-dark]
alpha=0.90
blur=yes
background=0A0A0B
foreground=C9CDD2
cursor=0A0A0B FF6A1A
regular0=0A0A0B
regular1=F5555B
regular2=7CCB9A
regular3=FF6A1A
regular4=8FB4E8
regular5=B9A5E8
regular6=7CC7CB
regular7=8A9099
bright0=6B717A
bright1=FF7B80
bright2=9BDDB4
bright3=FF8B4A
bright4=ADC8F0
bright5=CDBDF0
bright6=9AD8DB
bright7=F4F5F6
selection-foreground=F4F5F6
selection-background=1F2226
jump-labels=0A0A0B FF6A1A
scrollback-indicator=0A0A0B C9CDD2
search-box-no-match=0A0A0B F5555B
search-box-match=0A0A0B FF6A1A
urls=7CCB9A

[colors-light]
