# Nordschleife nacht launcher for fuzzel (unused: SUPER+D runs nordschleife-launcher, foot + fzf).

[main]
font=Barlow Semi Condensed:size=10.5,IBM Plex Sans Arabic:size=10.5
use-bold=no
prompt="›  "
placeholder=search
icons-enabled=yes
match-counter=yes
anchor=center
lines=8
width=90
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=36
layer=overlay
terminal=foot -e

[colors]
background=16181BF7
text=8A9099FF
message=8A9099FF
prompt=FF6A1AFF
placeholder=6B717AFF
input=F4F5F6FF
match=C9CDD2FF
selection=1F2226FF
selection-text=F4F5F6FF
selection-match=FF6A1AFF
counter=7CCB9AFF
border=C9CDD2FF

[border]
width=1
radius=3
