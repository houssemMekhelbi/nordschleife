# Nordschleife tag launcher for fuzzel (unused: SUPER+D runs nordschleife-launcher, foot + fzf).

[main]
font=Barlow Semi Condensed:size=10.5,IBM Plex Sans Arabic:size=10.5
use-bold=no
prompt="›  "
placeholder=search
icons-enabled=yes
match-counter=yes
anchor=center
lines=8
width=90
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=36
layer=overlay
terminal=foot -e

[colors]
background=F5F6F7F7
text=555B64FF
message=555B64FF
prompt=A83C00FF
placeholder=7A808AFF
input=0F1113FF
match=2B2F35FF
selection=DADDE2FF
selection-text=0F1113FF
selection-match=A83C00FF
counter=1A6B43FF
border=2B2F35FF

[border]
width=1
radius=3
