<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Nordschleife type (the same in both variants):
       display    Saira Stencil One        + Noto Kufi Arabic: lock clock, banner names
       interface  Barlow Semi Condensed    + Noto Kufi Arabic, IBM Plex Sans Arabic: GTK 11, bar labels, lock date
       data       Overpass Mono            + IBM Plex Sans Arabic, JetBrains Mono Nerd Font: terminals, bar values, launcher, yawm
     <accept> puts the companion directly after the Latin face, so only glyphs
     the Latin face lacks use it. -->
<fontconfig>
  <alias binding="same">
    <family>Barlow Semi Condensed</family>
    <accept><family>Noto Kufi Arabic</family><family>IBM Plex Sans Arabic</family></accept>
  </alias>
  <alias binding="same">
    <family>Saira Stencil One</family>
    <accept><family>Noto Kufi Arabic</family></accept>
  </alias>
  <alias binding="same">
    <family>Overpass Mono</family>
    <accept><family>IBM Plex Sans Arabic</family><family>JetBrainsMono Nerd Font</family></accept>
  </alias>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Barlow Semi Condensed</family>
      <family>Noto Kufi Arabic</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Barlow Semi Condensed</family>
      <family>Amiri</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Overpass Mono</family>
      <family>JetBrainsMono Nerd Font</family>
      <family>IBM Plex Sans Arabic</family>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>
</fontconfig>
