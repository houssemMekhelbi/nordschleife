# Nordschleife tag tmux. Two status lines at the bottom on the plate colour, like a
# scale with its legends: line 0 is a rule (\u2500) with a tick (\u252c)
# over every window and a heavy bar (\u2501) over the session block; the
# current window's tick is orange. Line 1 carries the labels under the ticks:
# the session as a flat aluminium block, windows as plain index:name, the
# current one bold in the text colour. No powerline glyphs: box-drawing
# characters only, which the terminals draw themselves, so the joins are exact.
# Both lines lay out the same cells in the same widths, so tick and label align.

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,alacritty*:RGB,xterm-ghostty:RGB,xterm-256color:RGB"


set -g status-position bottom
set -g status-interval 15
set -g status-justify left
set -g status 2
set -g status-style "bg=#F5F6F7,fg=#555B64"

# session block: " name " on aluminium, then one cell of gap
set -g status-left-length 44
set -g status-left "#[bg=#2B2F35,fg=#F4F5F6,bold] #S #[bg=#F5F6F7,nobold] "

set -g status-right-length 40
set -g status-right "#[fg=#1A6B43]#h  #[fg=#0F1113]%H:%M "

# every window cell is "I:W" plus three cells of gap
set -g window-status-separator ""
set -g window-status-format "#[fg=#555B64]#{?window_activity_flag,#[fg=#1A6B43],}#I:#W   "
set -g window-status-current-format "#[fg=#0F1113,bold]#I:#W#[nobold]   "
set -g window-status-activity-style "none"
set -g monitor-activity on
set -g visual-activity off

# line 0, the rule (in the dim colour: the hairline colour disappears on the plate) with ticks: the heavy bar spans the session block, then each
# window contributes a tick and a rule as wide as its label below (index, colon,
# name and three cells of gap, less the tick). Line 1 is tmux's stock status
# line, copied from the default of line 0 before line 0 is replaced; the unset
# first makes this safe to source again.
# Leaving this theme with tmux running: another theme's tmux.conf does not
# reset these, so run `tmux set -g status on \; set -gu status-format` once
# (or restart the tmux server).
set -gu status-format
set -gF status-format[1] "#{status-format[0]}"
set -g status-format[0] "#[bg=#F5F6F7,fg=#2B2F35]#{R:\u2501,#{e|+:2,#{n:session_name}}}#[fg=#7A808A]\u2500#{W:#[fg=#2B2F35]\u252c#[fg=#7A808A]#{R:\u2500,#{e|+:#{n:window_index},#{e|+:3,#{n:window_name}}}},#[fg=#A83C00]\u252c#[fg=#7A808A]#{R:\u2500,#{e|+:#{n:window_index},#{e|+:3,#{n:window_name}}}}}#{R:\u2500,200}"

# Pane borders: active aluminium, inactive hairline.
set -g pane-border-lines single
set -g pane-border-style "fg=#b9bec6"
set -g pane-active-border-style "fg=#2b2f35"
set -g pane-border-indicators off

set -g message-style "bg=#DADDE2,fg=#0F1113"
set -g message-command-style "bg=#DADDE2,fg=#A83C00"
set -g mode-style "bg=#DADDE2,fg=#0F1113"
set -g copy-mode-match-style "bg=#DADDE2,fg=#1A6B43,underscore"
set -g copy-mode-current-match-style "bg=#2B2F35,fg=#F4F5F6"
set -g menu-style "bg=#F5F6F7,fg=#555B64"
set -g menu-selected-style "bg=#DADDE2,fg=#0F1113"
set -g menu-border-style "fg=#2B2F35"
set -g menu-border-lines single
set -g popup-border-style "fg=#2B2F35"
set -g popup-border-lines single
set -g display-panes-colour "#B9BEC6"
set -g display-panes-active-colour "#A83C00"
set -g clock-mode-colour "#0F1113"
