# Nordschleife tag lock screen. Left column, flush at x=150: the clock in Saira Stencil
# One with running seconds beside it, the lap scale (the hour as one lap: three
# sector bars that fill, a 00-60 scale with the orange needle on the current
# minute), the date, the password plate with crop marks, one line of circuit
# facts. The circuit drawing of the wallpaper stays clear on the right.
# No username. Lines: ~/.config/hypr/nordschleife-tag/sayings.txt.
# hyprlock draws no ticks: the scale is an image. lock-scale.png (the bare scale,
# from build-art.py) shows first; ~/.local/bin/nordschleife-lock-scale then
# renders the current minute and hyprlock reloads it (the helper only re-renders
# when the minute changed). The plate is lock-field.png under a transparent field.
# Positions are for 1920x1080.

general {
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = true
}

background {
    monitor =
    path = ~/.config/hypr/nordschleife-tag/wallpaper.png
    color = rgb(E9EBEE)
    blur_passes = 0
    brightness = 0.96
    vibrancy = 0
    noise = 0.01
}

# ---- clock and seconds ---------------------------------------------------

label {
    monitor =
    text = $TIME
    color = rgba(0F1113FF)
    font_size = 120
    font_family = Saira Stencil One
    position = 150, 190
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +'.%S'
    color = rgba(555B64FF)
    font_size = 48
    font_family = Saira Stencil One
    position = 600, 160
    halign = left
    valign = center
}

# ---- the lap scale ---------------------------------------------------------

image {
    monitor =
    path = ~/.config/hypr/nordschleife-tag/lock-scale.png
    size = 112
    rounding = 0
    border_size = 0
    reload_time = 2
    reload_cmd = $HOME/.local/bin/nordschleife-lock-scale
    position = 130, 12
    halign = left
    valign = center
    zindex = 0
}

label {
    monitor =
    text = cmd[update:60000] echo "<span weight='500' letter_spacing='500'>$(date +'%A, %-d %B')</span>"
    color = rgba(2B2F35FF)
    font_size = 20
    font_family = Barlow Semi Condensed
    position = 150, -100
    halign = left
    valign = center
}

# ---- password plate ------------------------------------------------------

image {
    monitor =
    path = ~/.config/hypr/nordschleife-tag/lock-field.png
    size = 50
    rounding = 0
    border_size = 0
    position = 150, -183
    halign = left
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 440, 50
    outline_thickness = 0
    outer_color = rgba(00000000)
    inner_color = rgba(00000000)
    font_color = rgba(0F1113FF)
    font_family = Overpass Mono
    check_color = rgba(00000000)
    fail_color = rgba(00000000)
    capslock_color = rgba(00000000)
    rounding = 0
    dots_size = 0.20
    dots_spacing = 0.5
    dots_center = true
    dots_rounding = 0
    fade_on_empty = false
    placeholder_text = <span foreground="##555B64">password</span>
    fail_text = <span foreground="##B01E26">$FAIL</span>
    check_text = <span foreground="##1A6B43">verifying</span>
    zindex = 2
    position = 150, -183
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/nordschleife-lock-saying
    color = rgba(555B64FF)
    font_size = 13
    font_family = Barlow Semi Condensed
    position = 150, -250
    halign = left
    valign = center
}
