# Nordschleife tag terminal. Night at 95% with compositor blur behind it;
# parchment text, the cursor in the attention colour.
# Both colour sections carry the same palette so a light/dark switch keybind
# cannot pull in foot's stock colours.

[main]
font=Overpass Mono:size=10.5
line-height=20
pad=16x16
initial-color-theme=dark

[bell]
# A bell in a window without the focus marks it urgent, which the bar's workspace slot shows.
urgent=yes

[cursor]
style=beam
blink=no
beam-thickness=2

[colors-dark]
alpha=0.95
blur=yes
background=E9EBEE
foreground=2B2F35
cursor=E9EBEE A83C00
regular0=0F1113
regular1=B01E26
regular2=1A6B43
regular3=A83C00
regular4=1F4F96
regular5=5B3FA0
regular6=146A70
